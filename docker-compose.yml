version: '3.8'

services:
  users:
    container_name: rumour-users-service
    build:
      context: .  
      dockerfile: apps/users/Dockerfile  
    env_file:
      - env/api.env
    volumes:
      - ./apps/users/src:/app/src
      - ./packages/rumor-utils:/app/packages/rumor-utils
    ports:
      - "8000:8000"
    command: npm run dev  
    depends_on:
      rumor-db:
        condition: service_healthy

  events:
    container_name: rumour-events-service
    build:
      context: .  
      dockerfile: apps/events/Dockerfile 
    env_file:
      - env/api.env
    volumes:
      - ./apps/events/src:/app/src 
      - ./packages/rumor-utils:/app/packages/rumor-utils
    ports:
      - "8001:8001"
    command: npm run dev
    depends_on:
      rumor-db:
        condition: service_healthy

  rumor-db:
    image: postgres:latest
    container_name: rumor-backend-db
    restart: always
    environment:
      POSTGRES_USER: rumor
      POSTGRES_PASSWORD: rumor
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rumor"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  nginx:
    container_name: load-balancer
    image: nginx:latest
    ports:
      - "8080:8080"
    volumes:
      - ./tools/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - users
      - events

volumes:
  postgres_data:
